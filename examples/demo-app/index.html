<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Gudang</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#f3f4f6;color:#111}
header{background:#1e3a8a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
main{max-width:900px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px #0001;margin-bottom:16px}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:4px 0 12px;font:inherit}
button{background:#2563eb;color:#fff;border:0;padding:10px 18px;border-radius:8px;font:600 15px system-ui;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat b{font-size:26px;display:block}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}
.hide{display:none}nav a{color:#fff;margin-left:14px}.toast{background:#dcfce7;color:#166534;padding:10px;border-radius:8px}
</style></head><body>
<header><strong>Gudang Demo</strong><nav id="nav" class="hide"><a href="#dash">Dashboard</a><a href="#barang">Barang</a></nav></header>
<main>
<section id="login" class="card"><h2>Masuk</h2>
<label>Email<input id="email" type="email" placeholder="nama@contoh.id"></label>
<label>Kata sandi<input id="password" type="password"></label>
<button id="btn-login">Masuk</button></section>

<section id="dash" class="hide"><div class="card"><h2>Dashboard</h2>
<div class="grid"><div class="stat card"><b>128</b>Total barang</div><div class="stat card"><b>12</b>Stok menipis</div><div class="stat card"><b>5</b>Barang masuk hari ini</div></div></div>
<button id="btn-tambah">+ Tambah Barang</button></section>

<section id="form" class="card hide"><h2>Tambah Barang</h2>
<label>Nama barang<input id="nama"></label>
<label>Kategori<select id="kategori"><option>Elektronik</option><option>ATK</option><option>Furnitur</option></select></label>
<label>Jumlah<input id="jumlah" type="number"></label>
<button id="btn-simpan">Simpan</button></section>

<section id="barang" class="card hide"><h2>Daftar Barang</h2><div id="toast" class="toast hide">Barang berhasil disimpan</div>
<table><thead><tr><th>Nama</th><th>Kategori</th><th>Jumlah</th></tr></thead><tbody id="rows"><tr><td>Proyektor</td><td>Elektronik</td><td>4</td></tr></tbody></table></section>
</main>
<script>
const $=s=>document.querySelector(s);const show=id=>['login','dash','form','barang'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));
$('#btn-login').onclick=()=>{if($('#email').value&&$('#password').value){$('#nav').classList.remove('hide');show('dash')}};
$('#btn-tambah').onclick=()=>show('form');
$('#btn-simpan').onclick=()=>{const r=document.createElement('tr');r.innerHTML=`<td>${$('#nama').value}</td><td>${$('#kategori').value}</td><td>${$('#jumlah').value}</td>`;$('#rows').prepend(r);show('barang');$('#toast').classList.remove('hide')};
</script></body></html>
